   <g id="text_47">
    <text style="fill: #17263d; font: 11.8px 'DejaVu Sans'; text-anchor: start" x="565.632" y="644.776062" transform="rotate(-0 565.632 644.776062)">102 / 279</text>
   </g>
   <g id="text_48">
    <text style="fill: #17263d; font: 11.8px 'DejaVu Sans'; text-anchor: start" x="819.072" y="644.776062" transform="rotate(-0 819.072 644.776062)">LR: +5 detections, +12 false alerts</text>
   </g>
   <g id="text_49">
    <text style="fill: #53657b; font: 11.1px 'DejaVu Sans'; text-anchor: start" x="46.08" y="683.074266" transform="rotate(-0 46.08 683.074266)">Counts use the same 1,000 test employees. Targets were set on validation; realized test recall differs.</text>
   </g>
   <g id="text_50">
    <text style="fill: #53657b; font: 11.1px 'DejaVu Sans'; text-anchor: start" x="46.08" y="703.234266" transform="rotate(-0 46.08 703.234266)">Neither policy dominates. NN results use one seed; energy was not measured. Final operating policy still needs an alert/recall budget.</text>
