   <g id="text_1">
    <text style="fill: #245dce; font: 700 10.8px 'DejaVu Sans'; text-anchor: start" x="46.08" y="41.326312" transform="rotate(-0 46.08 41.326312)">EMPLOYEE ATTRITION  /  PROJECT OVERVIEW</text>
   </g>
   <g id="text_2">
    <text style="fill: #17263d; font: 700 27px 'DejaVu Sans'; text-anchor: start" x="46.08" y="77.395781" transform="rotate(-0 46.08 77.395781)">Experiments and final model selection</text>
   </g>
   <g id="text_3">
    <text style="fill: #53657b; font: 12.5px 'DejaVu Sans'; text-anchor: start" x="46.08" y="100.218047" transform="rotate(-0 46.08 100.218047)">Training CV selects configurations; validation defines policies; the same test employees compare the frozen candidates.</text>
   </g>
   <g id="text_4">
    <text style="fill: #245dce; font: 700 10.5px 'DejaVu Sans'; text-anchor: start" x="65.664" y="144.778359" transform="rotate(-0 65.664 144.778359)">01  BASELINES</text>
   </g>
   <g id="text_5">
    <text style="fill: #17263d; font: 700 15.4px 'DejaVu Sans'; text-anchor: start" x="65.664" y="171.541594" transform="rotate(-0 65.664 171.541594)">Compare four model families</text>
   </g>
   <g id="text_6">
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(65.664 200.222062)">Dummy · logistic regression</text>
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(65.664 215.426439)">Decision tree · random forest</text>
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(65.664 230.630815)">Five stratified training folds</text>
   </g>
   <g id="text_7">
    <text style="fill: #245dce; font: 700 10.5px 'DejaVu Sans'; text-anchor: start" x="440.064" y="144.778359" transform="rotate(-0 440.064 144.778359)">02  EXPERIMENTS</text>
   </g>
   <g id="text_8">
    <text style="fill: #17263d; font: 700 15.4px 'DejaVu Sans'; text-anchor: start" x="440.064" y="171.541594" transform="rotate(-0 440.064 171.541594)">Challenge the feature set</text>
   </g>
   <g id="text_9">
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(440.064 200.222062)">VIF / group VIF · RF importance</text>
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(440.064 215.426439)">Engineering · 25 single-feature removals</text>
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(440.064 230.630815)">Two NN inputs · thresholds / ensemble</text>
   </g>
   <g id="text_10">
    <text style="fill: #245dce; font: 700 10.5px 'DejaVu Sans'; text-anchor: start" x="814.464" y="144.778359" transform="rotate(-0 814.464 144.778359)">03  FOCUSED TUNING</text>
   </g>
   <g id="text_11">
    <text style="fill: #17263d; font: 700 15.4px 'DejaVu Sans'; text-anchor: start" x="814.464" y="171.541594" transform="rotate(-0 814.464 171.541594)">Keep the search small</text>
   </g>
   <g id="text_12">
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(814.464 200.222062)">LR: 24 settings; regularization / weights</text>
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(814.464 215.426439)">NN: 12 settings; 8 or 16 neurons</text>
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(814.464 230.630815)">Select by CV AP, then review cost / recall</text>
   </g>
   <g id="text_13">
    <text style="fill: #245dce; font: 700 10.8px 'DejaVu Sans'; text-anchor: start" x="65.664" y="311.326313" transform="rotate(-0 65.664 311.326313)">REVIEWED DEFAULT CANDIDATE</text>
   </g>
