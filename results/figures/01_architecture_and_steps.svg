   <g id="text_1">
    <text style="fill: #245dce; font: 700 10.8px 'DejaVu Sans'; text-anchor: start" x="46.08" y="41.326312" transform="rotate(-0 46.08 41.326312)">EMPLOYEE ATTRITION  /  PROJECT OVERVIEW</text>
   </g>
   <g id="text_2">
    <text style="fill: #17263d; font: 700 27px 'DejaVu Sans'; text-anchor: start" x="46.08" y="77.395781" transform="rotate(-0 46.08 77.395781)">Architecture and steps followed</text>
   </g>
   <g id="text_3">
    <text style="fill: #53657b; font: 12.5px 'DejaVu Sans'; text-anchor: start" x="46.08" y="100.218047" transform="rotate(-0 46.08 100.218047)">Original Kaggle data → exploratory analysis → fold-safe modelling → reviewed final comparison</text>
   </g>
   <g id="text_4">
    <text style="fill: #245dce; font: 700 10.5px 'DejaVu Sans'; text-anchor: start" x="65.664" y="144.778359" transform="rotate(-0 65.664 144.778359)">01  SOURCE + TRANSLATION</text>
   </g>
   <g id="text_5">
    <text style="fill: #17263d; font: 700 15.4px 'DejaVu Sans'; text-anchor: start" x="65.664" y="171.541594" transform="rotate(-0 65.664 171.541594)">Make the data understandable</text>
   </g>
   <g id="text_6">
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(65.664 200.222062)">5,030 rows × 27 columns</text>
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(65.664 215.426439)">Translate six categorical columns</text>
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(65.664 230.630815)">Retain missing values for later handling</text>
   </g>
   <g id="text_7">
    <text style="fill: #245dce; font: 700 10.5px 'DejaVu Sans'; text-anchor: start" x="440.064" y="144.778359" transform="rotate(-0 440.064 144.778359)">02  EDA + QUALITY CHECKS</text>
   </g>
   <g id="text_8">
    <text style="fill: #17263d; font: 700 15.4px 'DejaVu Sans'; text-anchor: start" x="440.064" y="171.541594" transform="rotate(-0 440.064 171.541594)">Understand patterns and issues</text>
   </g>
   <g id="text_9">
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(440.064 200.222062)">Distributions, target relationships, tests</text>
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(440.064 215.426439)">Correlations, missingness and outlier flags</text>
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(440.064 230.630815)">EDA describes the original 5,030 rows</text>
   </g>
   <g id="text_10">
    <text style="fill: #245dce; font: 700 10.5px 'DejaVu Sans'; text-anchor: start" x="814.464" y="144.778359" transform="rotate(-0 814.464 144.778359)">03  DEDUPLICATE + SPLIT</text>
   </g>
   <g id="text_11">
    <text style="fill: #17263d; font: 700 15.4px 'DejaVu Sans'; text-anchor: start" x="814.464" y="171.541594" transform="rotate(-0 814.464 171.541594)">Preserve employee separation</text>
   </g>
   <g id="text_12">
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(814.464 200.222062)">Remove 30 duplicates → 5,000 employees</text>
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(814.464 215.426439)">25 predictors; exclude ID and target</text>
    <text style="fill: #53657b; font: 12.4px 'DejaVu Sans'" transform="translate(814.464 230.630815)">Stratified 60 / 20 / 20 split; seed 42</text>
   </g>
   <g id="text_13">
    <text style="fill: #53657b; font: 9.5px 'DejaVu Sans'; text-anchor: end" x="259.2" y="275.778516" transform="rotate(-0 259.2 275.778516)">TRAIN</text>
   </g>
   <g id="text_14">
    <text style="fill: #53657b; font: 9.5px 'DejaVu Sans'; text-anchor: end" x="702.72" y="275.778516" transform="rotate(-0 702.72 275.778516)">VALIDATION</text>
   </g>
   <g id="text_15">
    <text style="fill: #53657b; font: 9.5px 'DejaVu Sans'; text-anchor: end" x="984.96" y="275.778516" transform="rotate(-0 984.96 275.778516)">TEST</text>
   </g>
   <g id="text_16">
    <text style="fill: #245dce; font: 700 10.5px 'DejaVu Sans'; text-anchor: start" x="65.664" y="317.578359" transform="rotate(-0 65.664 317.578359)">04  TRAINING: 3,000 EMPLOYEES</text>
   </g>
   <g id="text_17">
    <text style="fill: #17263d; font: 700 15.4px 'DejaVu Sans'; text-anchor: start" x="65.664" y="344.341594" transform="rotate(-0 65.664 344.341594)">Fit pipelines inside five stratified CV folds</text>
   </g>
   <g id="text_18">
    <text style="fill: #53657b; font: 12.6px 'DejaVu Sans'" transform="translate(65.664 373.174031)">Learn imputation, encoding and feature medians</text>
    <text style="fill: #53657b; font: 12.6px 'DejaVu Sans'" transform="translate(65.664 388.623639)">LR / NN: standardize numeric + ordinal values</text>
    <text style="fill: #53657b; font: 12.6px 'DejaVu Sans'" transform="translate(65.664 404.073248)">Trees: keep numeric + ordinal values unscaled</text>
    <text style="fill: #53657b; font: 12.6px 'DejaVu Sans'" transform="translate(65.664 419.522856)">Compare baselines, feature variants and small grids</text>
    <text style="fill: #53657b; font: 12.6px 'DejaVu Sans'" transform="translate(65.664 434.972464)">Never fit preprocessing on validation or test rows</text>
   </g>
   <g id="text_19">
    <text style="fill: #245dce; font: 700 10.5px 'DejaVu Sans'; text-anchor: start" x="618.624" y="317.578359" transform="rotate(-0 618.624 317.578359)">05  VALIDATION: 1,000</text>
   </g>
   <g id="text_20">
    <text style="fill: #17263d; font: 700 15.4px 'DejaVu Sans'; text-anchor: start" x="618.624" y="344.341594" transform="rotate(-0 618.624 344.341594)">Review useful trade-offs</text>
   </g>
   <g id="text_21">
    <text style="fill: #53657b; font: 12.2px 'DejaVu Sans'" transform="translate(618.624 372.870094)">Compare precision / recall</text>
    <text style="fill: #53657b; font: 12.2px 'DejaVu Sans'" transform="translate(618.624 387.829238)">Check false-alert workload</text>
    <text style="fill: #53657b; font: 12.2px 'DejaVu Sans'" transform="translate(618.624 402.788383)">Review threshold options</text>
    <text style="fill: #53657b; font: 12.2px 'DejaVu Sans'" transform="translate(618.624 417.747527)">Use validation-defined</text>
    <text style="fill: #53657b; font: 12.2px 'DejaVu Sans'" transform="translate(618.624 432.706671)">40% and 60% recall targets</text>
   </g>
   <g id="text_22">
    <text style="fill: #245dce; font: 700 10.5px 'DejaVu Sans'; text-anchor: start" x="918.144" y="317.578359" transform="rotate(-0 918.144 317.578359)">06  TEST: 1,000</text>
   </g>
   <g id="text_23">
    <text style="fill: #17263d; font: 700 15.4px 'DejaVu Sans'; text-anchor: start" x="918.144" y="344.341594" transform="rotate(-0 918.144 344.341594)">Frozen comparison</text>
   </g>
   <g id="text_24">
    <text style="fill: #53657b; font: 12.2px 'DejaVu Sans'" transform="translate(918.144 372.870094)">Use reviewed settings</text>
    <text style="fill: #53657b; font: 12.2px 'DejaVu Sans'" transform="translate(918.144 387.829238)">and threshold policies</text>
    <text style="fill: #53657b; font: 12.2px 'DejaVu Sans'" transform="translate(918.144 402.788383)">Report ranking and alerts</text>
    <text style="fill: #53657b; font: 12.2px 'DejaVu Sans'" transform="translate(918.144 417.747527)">Do not tune on test</text>
    <text style="fill: #53657b; font: 12.2px 'DejaVu Sans'" transform="translate(918.144 432.706671)">Test already evaluated</text>
   </g>
   <g id="text_25">
    <text style="fill: #245dce; font: 700 10.8px 'DejaVu Sans'; text-anchor: start" x="69.12" y="538.126313" transform="rotate(-0 69.12 538.126313)">07  DECISION + REPRODUCIBLE OUTPUTS</text>
   </g>
   <g id="text_26">
    <text style="fill: #17263d; font: 700 17px 'DejaVu Sans'; text-anchor: start" x="69.12" y="565.157344" transform="rotate(-0 69.12 565.157344)">Retain logistic regression; keep the 8-neuron NN as a challenger.</text>
   </g>
   <g id="text_27">
    <text style="fill: #53657b; font: 12.8px 'DejaVu Sans'; text-anchor: start" x="69.12" y="590.046" transform="rotate(-0 69.12 590.046)">Four ordered notebooks + one Kaggle notebook • scaled/unscaled CSVs • fitted pipelines • execution checks</text>
   </g>
   <g id="text_28">
    <text style="fill: #53657b; font: 11.4px 'DejaVu Sans'; text-anchor: start" x="46.08" y="659.542219" transform="rotate(-0 46.08 659.542219)">Attrition prevalence: 16.34% after deduplication. Earlier EDA viewed all rows; validation was reused during development.</text>
   </g>
   <g id="text_29">
    <text style="fill: #53657b; font: 11.4px 'DejaVu Sans'; text-anchor: start" x="46.08" y="680.422219" transform="rotate(-0 46.08 680.422219)">The test stage describes the completed study; it is not a new independent evaluation.</text>
   </g>
  </g>
 </g>
